<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doodle3D</title>
<style>
:root{--bg:#f4f1fa;--panel:#fff;--ink:#241b3a;--mute:#7a6f94;--accent:#7c4dff;--line:#ddd5ee;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15101f;--panel:#211a33;--ink:#f1ecfb;--mute:#9d92b8;--accent:#9b7bff;--line:#352b4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15101f;--panel:#211a33;--ink:#f1ecfb;--mute:#9d92b8;--accent:#9b7bff;--line:#352b4d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center}
#prompt{font-size:1.15rem;font-weight:700}
#prompt small{display:block;font-size:.75rem;font-weight:500;color:var(--mute)}
#count{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.85rem}
#stage{position:relative;flex:1;margin:0 12px;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line);min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;inset:auto 0 14px;text-align:center;color:var(--mute);font-size:.85rem;pointer-events:none}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
#bar{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:center}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;min-height:48px;padding:0 18px;flex:1}
button.main{background:var(--accent);color:#fff;border-color:transparent;flex:2}
button:active{transform:scale(.97)}
.sw{flex:none;width:40px;min-height:40px;height:40px;padding:0;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
#view{display:none}
#depthRow{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--mute)}
#depthRow input{flex:1;accent-color:var(--accent)}
body.v #view{display:flex}body.v #drawbar{display:none}
</style>
</head>
<body>
<div id="app">
<header><div id="prompt"></div><div id="count">Made: 0</div></header>
<div id="stage"><canvas id="gl"></canvas><canvas id="draw"></canvas><div id="hint">Draw one shape with your finger</div><div id="toast"></div></div>
<div id="bar">
<div id="drawbar"><div class="row" id="sws" style="margin-bottom:10px"></div>
<div class="row"><button id="clear">Clear</button><button id="make" class="main">Make it 3D ✨</button></div></div>
<div id="view"><div style="display:flex;flex-direction:column;gap:10px;width:100%">
<div id="depthRow">Thickness<input type="range" id="depth" min="0.2" max="3" step="0.05" value="1.2"></div>
<div class="row"><button id="redraw">Redraw</button><button id="next" class="main">Next prompt →</button></div></div></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const stage=$('#stage'),dc=$('#draw'),dx=dc.getContext('2d');
const COLORS=['#ff5fa2','#ffb02e','#2ecc9a','#3ea6ff','#9b6bff'];
const PROMPTS=['a star','a heart','a fish','a house','a cloud','a lightning bolt','a leaf','a crown','a spiral','a snake','a flower','a rocket'];
let pts=[],drawing=false,color=COLORS[0],depth=1.2,made=0,norm=[],closed=false,mode='draw',pi=0;

// three.js setup
const renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(0,0.5,11);
scene.add(new THREE.HemisphereLight(0xffffff,0x6655aa,.9));
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(4,6,8);scene.add(sun);
const group=new THREE.Group();scene.add(group);
let vx=0,dragging=false,lx=0,ly=0;

function size(){
  const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;
  dc.width=r.width*d;dc.height=r.height*d;dx.setTransform(d,0,0,d,0,0);
  renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();paint();
}
function paint(){
  const r=stage.getBoundingClientRect();dx.clearRect(0,0,r.width,r.height);
  if(pts.length<2)return;
  dx.strokeStyle=color;dx.lineWidth=7;dx.lineCap=dx.lineJoin='round';
  dx.beginPath();dx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>dx.lineTo(p.x,p.y));dx.stroke();
}
function pos(e){const r=dc.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
dc.addEventListener('pointerdown',e=>{if(mode!=='draw')return;dc.setPointerCapture(e.pointerId);drawing=true;pts=[pos(e)];$('#hint').style.display='none';paint()});
dc.addEventListener('pointermove',e=>{
  if(drawing){const p=pos(e),l=pts[pts.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)>3){pts.push(p);paint()}}
  else if(dragging){const dX=e.clientX-lx,dY=e.clientY-ly;lx=e.clientX;ly=e.clientY;vx=dX*.01;group.rotation.y+=dX*.01;group.rotation.x=Math.max(-1.2,Math.min(1.2,group.rotation.x+dY*.01))}
});
const up=()=>{drawing=false;dragging=false};
dc.addEventListener('pointerup',up);dc.addEventListener('pointercancel',up);
dc.addEventListener('pointerdown',e=>{if(mode==='view'){dragging=true;lx=e.clientX;ly=e.clientY;dc.setPointerCapture(e.pointerId)}});

function toast(t){const el=$('#toast');el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,1600)}

function prepare(){
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const s=4/Math.max(x1-x0,y1-y0,1),cx=(x0+x1)/2,cy=(y0+y1)/2,n=80;
  let a=[];for(let i=0;i<n;i++){const p=pts[Math.floor(i*(pts.length-1)/(n-1))];a.push(new THREE.Vector2((p.x-cx)*s,-(p.y-cy)*s))}
  closed=a[0].distanceTo(a[n-1])<1.1;
  if(closed)a.pop();
  const m=a.length;
  norm=a.map((p,i)=>{const q=a[(i+m-1)%m],r=a[(i+1)%m];
    const lo=closed||(i>0&&i<m-1);return lo?new THREE.Vector2((q.x+p.x+r.x)/3,(q.y+p.y+r.y)/3):p});
}
function build(){
  while(group.children.length){const c=group.children.pop();c.geometry&&c.geometry.dispose()}
  const mat=new THREE.MeshStandardMaterial({color,roughness:.35,metalness:.1});
  if(closed){
    const g=new THREE.ExtrudeGeometry(new THREE.Shape(norm),{depth,bevelEnabled:true,bevelThickness:.12,bevelSize:.12,bevelSegments:3,curveSegments:1});
    g.center();group.add(new THREE.Mesh(g,mat));
  }else{
    const k=norm.length,v=norm.map((p,i)=>new THREE.Vector3(p.x,p.y,Math.sin(i/(k-1)*Math.PI)*depth*.8));
    const r=.08+depth*.1;
    group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(v),160,r,10),mat));
    [v[0],v[k-1]].forEach(p=>{const s=new THREE.Mesh(new THREE.SphereGeometry(r,12,12),mat);s.position.copy(p);group.add(s)});
  }
}
function setMode(m){mode=m;document.body.classList.toggle('v',m==='view');renderer.domElement.style.display='block';
  dc.style.background=m==='draw'?'transparent':'transparent';
  if(m==='view'){group.rotation.set(-.35,0,0);vx=.012}else{$('#hint').style.display='';}}
function newPrompt(){pi=(pi+1+Math.floor(Math.random()*3))%PROMPTS.length;showPrompt()}
function showPrompt(){$('#prompt').innerHTML='Draw '+PROMPTS[pi]+'<small>or anything you like</small>'}

$('#make').onclick=()=>{
  if(pts.length<10){toast('Draw a bigger shape first');return}
  prepare();build();made++;$('#count').textContent='Made: '+made;
  pts=[];paint();setMode('view');
};
$('#clear').onclick=()=>{pts=[];paint();$('#hint').style.display=''};
$('#redraw').onclick=()=>{pts=[];paint();setMode('draw')};
$('#next').onclick=()=>{newPrompt();pts=[];paint();setMode('draw')};
$('#depth').oninput=e=>{depth=+e.target.value;build()};
const sw=$('#sws');
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=c;b.setAttribute('aria-label','Colour '+(i+1));
  b.onclick=()=>{color=c;sw.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on');paint()};sw.appendChild(b)});

(function loop(){
  requestAnimationFrame(loop);
  if(mode==='view'){if(!dragging){group.rotation.y+=vx;vx+=(.012-vx)*.03}}
  renderer.render(scene,camera);
})();
// in view mode, hide the 2D layer's drawing but keep it for drag input
addEventListener('resize',size);
showPrompt();setMode('draw');size();
</script>
</body>
</html>
